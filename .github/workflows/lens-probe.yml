name: Goofish lens price probe

# 手动运行一次：只搜 15 个镜头的第 1 页，不保存会话。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-radar-collector
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright cryptography
          python -m playwright install --with-deps chromium

      - name: Start home SOCKS tunnel
        id: home
        env:
          HOME_SSH_HOST: ${{ secrets.HOME_SSH_HOST }}
          HOME_SSH_PRIVATE_KEY: ${{ secrets.HOME_SSH_PRIVATE_KEY }}
          HOME_SSH_KNOWN_HOSTS: ${{ secrets.HOME_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python - <<'PY'
          import os
          from pathlib import Path
          home = Path.home() / ".ssh"
          key = os.environ.get("HOME_SSH_PRIVATE_KEY", "").lstrip("\ufeff")
          key = key.replace("\r\n", "\n").replace("\r", "\n").strip("\n") + "\n"
          known = os.environ.get("HOME_SSH_KNOWN_HOSTS", "").lstrip("\ufeff")
          known = known.replace("\r\n", "\n").replace("\r", "\n").strip("\n") + "\n"
          (home / "be3600_watchradar").write_text(key, encoding="utf-8")
          (home / "known_hosts").write_text(known, encoding="utf-8")
          PY

          chmod 600 ~/.ssh/be3600_watchradar ~/.ssh/known_hosts
          HOME_HOST="$(python - <<'PY'
          import os
          print(os.environ.get('HOME_SSH_HOST','').lstrip('\ufeff').strip())
          PY
          )"

          if [ -z "$HOME_HOST" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HOME_SSH_HOST is empty"
            exit 0
          fi

          ssh -fNT \
            -D 127.0.0.1:1080 \
            -p 40222 \
            -i ~/.ssh/be3600_watchradar \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            root@"$HOME_HOST"

          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Home SSH tunnel failed; JP collection will still publish."
            exit 0
          fi

          sleep 2
          EXIT_IP="$(curl -fsS --max-time 15 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org)"
          if [ -n "$EXIT_IP" ]; then
            echo "::add-mask::$EXIT_IP"
            echo "Home exit OK"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SOCKS tunnel opened but proxy check failed."
          fi

      - name: Restore Goofish session
        if: steps.home.outputs.available == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .goofish_state
          key: goofish-state-${{ github.run_id }}
          restore-keys: goofish-state-

      - name: Probe lens prices
        if: steps.home.outputs.available == 'true'
        env:
          GOOFISH_STORAGE_STATE_B64: ${{ secrets.GOOFISH_STORAGE_STATE_B64 }}
          GOOFISH_STATE_KEY_MATERIAL: ${{ secrets.HOME_SSH_PRIVATE_KEY }}
          WATCH_SOCKS_PROXY: socks5://127.0.0.1:1080
        run: xvfb-run -a python goofish_lens_probe.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lens-probe
          path: lens_probe.json
          retention-days: 3
