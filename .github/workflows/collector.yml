name: Watch Radar Cloud Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: watch-radar-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collect market data
        env:
          GOOFISH_STORAGE_STATE_B64: ${{ secrets.GOOFISH_STORAGE_STATE_B64 }}
        run: python collector.py

      - name: Publish latest data
        run: |
          git config user.name "Watch Radar Cloud"
          git config user.email "watch-radar@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
