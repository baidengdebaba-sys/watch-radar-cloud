name: Watch Radar Cloud Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: watch-radar-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Preserve previous market snapshot
        run: python preserve_items.py

      - name: Collect Japanese market data
        run: python collector.py

      - name: Start home SOCKS tunnel
        id: home
        env:
          HOME_SSH_HOST: ${{ secrets.HOME_SSH_HOST }}
          HOME_SSH_PRIVATE_KEY: ${{ secrets.HOME_SSH_PRIVATE_KEY }}
          HOME_SSH_KNOWN_HOSTS: ${{ secrets.HOME_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python - <<'PY'
          import os
          from pathlib import Path
          home = Path.home() / ".ssh"
          key = os.environ.get("HOME_SSH_PRIVATE_KEY", "").lstrip("\ufeff")
          key = key.replace("\r\n", "\n").replace("\r", "\n").strip("\n") + "\n"
          known = os.environ.get("HOME_SSH_KNOWN_HOSTS", "").lstrip("\ufeff")
          known = known.replace("\r\n", "\n").replace("\r", "\n").strip("\n") + "\n"
          (home / "be3600_watchradar").write_text(key, encoding="utf-8")
          (home / "known_hosts").write_text(known, encoding="utf-8")
          PY

          chmod 600 ~/.ssh/be3600_watchradar ~/.ssh/known_hosts
          HOME_HOST="$(python - <<'PY'
          import os
          print(os.environ.get('HOME_SSH_HOST','').lstrip('\ufeff').strip())
          PY
          )"

          if [ -z "$HOME_HOST" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "HOME_SSH_HOST is empty"
            exit 0
          fi

          ssh -fNT \
            -D 127.0.0.1:1080 \
            -p 40222 \
            -i ~/.ssh/be3600_watchradar \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o HostKeyAlgorithms=+ssh-rsa \
            -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ExitOnForwardFailure=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            root@"$HOME_HOST"

          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Home SSH tunnel failed; JP collection will still publish."
            exit 0
          fi

          sleep 2
          EXIT_IP="$(curl -fsS --max-time 15 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org)"
          if [ -n "$EXIT_IP" ]; then
            echo "Home exit IP: $EXIT_IP"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SOCKS tunnel opened but proxy check failed."
          fi

      - name: Collect Goofish through home residential exit
        if: steps.home.outputs.available == 'true'
        env:
          GOOFISH_STORAGE_STATE_B64: ${{ secrets.GOOFISH_STORAGE_STATE_B64 }}
          WATCH_SOCKS_PROXY: socks5://127.0.0.1:1080
        run: xvfb-run -a python goofish_targeted.py

      - name: Restore previous items if home exit unavailable
        if: steps.home.outputs.available != 'true'
        run: python preserve_items.py restore

      - name: Repair Goofish model references
        if: always()
        run: python repair_refs.py

      - name: Prepare top manual buyback inquiry drafts
        if: always()
        run: python inquiry_queue.py

      - name: Publish latest data
        if: always()
        run: |
          git config user.name "Watch Radar Cloud"
          git config user.email "watch-radar@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
