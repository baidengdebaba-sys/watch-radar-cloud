name: Watch Radar Cloud Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: watch-radar-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Preserve previous Goofish snapshot
        run: python preserve_items.py

      - name: Collect Japanese market data
        run: python collector.py

      - name: Start home SOCKS tunnel
        id: home
        env:
          HOME_SSH_HOST: ${{ secrets.HOME_SSH_HOST }}
          HOME_SSH_PRIVATE_KEY: ${{ secrets.HOME_SSH_PRIVATE_KEY }}
          HOME_SSH_KNOWN_HOSTS: ${{ secrets.HOME_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set +e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          python resolve_home.py
          if [ $? -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          key=os.environ.get('HOME_SSH_PRIVATE_KEY','').lstrip('\ufeff').replace('\r\n','\n').replace('\r','\n').strip('\n')+'\n'
          (Path.home()/'.ssh'/'be3600_watchradar').write_text(key,encoding='utf-8')
          PY
          cp /tmp/watchradar_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/be3600_watchradar ~/.ssh/known_hosts
          HOME_HOST="$(cat /tmp/watchradar_home_host)"
          ssh -fNT -D 127.0.0.1:1080 -p 40222 -i ~/.ssh/be3600_watchradar \
            -o BatchMode=yes -o PasswordAuthentication=no \
            -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ExitOnForwardFailure=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 root@"$HOME_HOST"
          if [ $? -ne 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sleep 2
          curl -fsS --max-time 15 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org >/dev/null
          if [ $? -eq 0 ]; then
            echo "Home residential exit verified"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Goofish through home residential exit
        if: steps.home.outputs.available == 'true'
        env:
          GOOFISH_STORAGE_STATE_B64: ${{ secrets.GOOFISH_STORAGE_STATE_B64 }}
          WATCH_SOCKS_PROXY: socks5://127.0.0.1:1080
          WATCH_PREVIOUS_DATA: /tmp/watchradar_previous.json
        run: xvfb-run -a python goofish_home.py

      - name: Restore previous Goofish items if home exit unavailable
        if: steps.home.outputs.available != 'true'
        run: python preserve_items.py restore

      - name: Publish latest data
        if: always()
        run: |
          git config user.name "Watch Radar Cloud"
          git config user.email "watch-radar@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market data $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
