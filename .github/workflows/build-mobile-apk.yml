name: Build Watch Radar Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: mobile
        run: gradle --no-daemon assembleDebug

      - name: Save APK
        run: |
          mkdir -p downloads
          cp mobile/app/build/outputs/apk/debug/app-debug.apk downloads/WatchRadarMobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WatchRadarMobile
          path: downloads/WatchRadarMobile.apk

      - name: Commit APK back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/WatchRadarMobile.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Watch Radar Mobile APK"
            git push
          fi
